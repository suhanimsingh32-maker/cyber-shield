<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>CyberShield — Stay Safe Online | AI-Powered Digital Safety</title>
  <meta name="description" content="CyberShield helps you check if links, messages, QR codes, and screenshots are safe. Get instant, easy-to-understand safety results powered by AI. Free digital fraud protection.">
  <meta name="theme-color" content="#0f1419" id="meta-theme-color">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Theme initialization — must run before body renders to prevent flash -->
  <script>
    (function() {
      var theme = localStorage.getItem('cybershield_theme') || 'dark';
      document.documentElement.classList.add(theme);
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.content = theme === 'light' ? '#f0f2f5' : '#0f1419';
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- HTML5 QR Code Scanner Library for Live Camera QR Scanning -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Tesseract.js for Real Client-Side OCR Image Text Extraction -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- React 18 & ReactDOM 18 UMD (Fast & Reliable) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js CDN for SOC analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- CyberShield Design System CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen pb-16 md:pb-0">
  <div id="root"></div>

  <!-- React Application Script -->
  <script src="/js/app.js"></script>
</body>
</html>
